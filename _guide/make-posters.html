<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Saker · make posters</title>
<style>
  body { margin: 0; background: #111; color: #ddd; font: 12px/1.5 system-ui, sans-serif; }
  #log { padding: 8px; white-space: pre; }
  iframe { border: 0; position: absolute; left: 0; top: 0; visibility: hidden; }
</style>
</head>
<body>
<!-- Renders the sign-in landscape's FIRST FRAME at each screen shape, from the live scene itself, and saves:
     brand/posters/<name>.webp  — the poster shown on a first visit until the live land fades in over it;
     brand/posters/manifest.json — {look, dir, list:[{a, f, h, q}]}: aspect, file, horizon fraction, tiny placeholder.
     Run it after ANY change to the look (and bump LOOK in terrain.js): python -I sink.py "<project>/brand/posters"
     then open /Projects/Saker/_guide/make-posters.html and call run(). Paste manifest.json into index.html. -->
<div id="log">call run()</div>
<script>
// CSS size the scene is laid out at, and the pixel density it is drawn at (posters ≈ a real screen of that shape)
// Browser windows come in every shape (a 16:9 laptop's window is ≈1.95:1 once the toolbars are off), so the
// posters sit ≈4–5% apart: the shown poster is never more than one step from the screen's shape.
// Wide layout (aspect ≥ 0.8): the scene is width-scaled, so any CSS size works — ≈2.1 MP each.
// Tall layout (phones/tablets): the composition uses some fixed pixel sizes → real device widths, drawn at 2×.
// lq: this shape also carries the tiny inline placeholder (6 of them cover all shapes once blurred).
const WIDE = [0.85, 0.92, 1.0, 1.08, 1.16, 1.25, 1.33, 1.42, 1.5, 1.6, 1.7, 1.78, 1.86, 1.95, 2.05, 2.16, 2.37];
const TALL = [0.45, 0.49, 0.53, 0.5625, 0.6, 0.65, 0.7, 0.75];
const LQ = [1.0, 1.42, 1.86, 2.37, 0.49, 0.7];
const SHAPES = [
  ...WIDE.map(a => { const w = Math.round(Math.sqrt(2.1e6 * a)); return { n: 'w' + Math.round(a * 100), w, h: Math.round(w / a), dpr: 1, lq: LQ.includes(a) }; }),
  ...TALL.map(a => { const w = a < 0.6 ? 390 : a < 0.7 ? 600 : 768; return { n: 'p' + Math.round(a * 1000), w, h: Math.round(w / a), dpr: a < 0.7 ? 2 : 1.6, lq: LQ.includes(a) }; }),
];
const SINK = 'http://127.0.0.1:5758/';
const log = s => (document.getElementById('log').textContent += '\n' + s);
const post = (name, body) => fetch(SINK + name, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body }).then(r => r.text());

function frameOf(win) {                                           // the live canvas, rows flipped, as a 2D canvas
  const cv = win.document.getElementById('si-terrain'), gl = cv.getContext('webgl2');
  const W = cv.width, H = cv.height, px = new Uint8Array(W * H * 4);
  gl.readPixels(0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, px);
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d'), im = x.createImageData(W, H);
  for (let y = 0; y < H; y++) im.data.set(px.subarray((H - 1 - y) * W * 4, (H - y) * W * 4), y * W * 4);
  x.putImageData(im, 0, 0); return c;
}
function shrink(c, w) { const s = document.createElement('canvas'); s.width = w; s.height = Math.round(c.height * w / c.width); s.getContext('2d').drawImage(c, 0, 0, s.width, s.height); return s; }

async function one(s) {
  try { sessionStorage.removeItem('saker.session'); } catch (e) {}
  const f = document.createElement('iframe');
  f.style.width = s.w + 'px'; f.style.height = s.h + 'px';
  f.src = `../index.html?qa&dpr=${s.dpr}&t=${Date.now()}`;
  document.body.appendChild(f);
  await new Promise(r => f.onload = r);
  const win = f.contentWindow;
  for (let i = 0; i < 100 && !(win.SakerTerrain && win.SakerTerrain.debug().layout); i++) await new Promise(r => setTimeout(r, 50));
  const T = win.SakerTerrain, L = T.debug().layout;
  T.stop(); T.renderNow(true); T.stop();
  const c = frameOf(win);
  const big = await post(`${s.n}.webp`, c.toDataURL('image/webp', 0.8));
  const lqip = s.lq ? shrink(c, 32).toDataURL('image/webp', 0.45) : null;
  f.remove();
  log(`${s.n}: ${c.width}×${c.height}  ${Math.round(big / 1024)} KB${lqip ? '  placeholder ' + lqip.length + ' B' : ''}`);
  const p = { a: +(s.w / s.h).toFixed(4), f: `${s.n}.webp`, h: +(L.cy / L.H).toFixed(4), look: T.LOOK };
  if (lqip) p.q = lqip;
  return p;
}

async function run() {
  const list = [];
  for (const s of SHAPES) list.push(await one(s));
  const manifest = { look: list[0].look, dir: 'brand/posters/', list: list.map(({ look, ...p }) => p) };
  await post('manifest.json', JSON.stringify(manifest));
  log('done: manifest.json');
  return manifest;
}
</script>
</body>
</html>
