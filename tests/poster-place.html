<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Saker · poster place parity</title>
<style>body { background: #111; color: #ddd; font: 13px/1.5 system-ui, sans-serif; padding: 12px; } .bad { color: #f77; } .ok { color: #7d7; }</style>
</head>
<body>
<!-- The <head> of index.html places the sharp poster BEFORE any script loads, with a copy of terrain.js's rules
     (pickPoster · compose's horizon · posterBox). This page runs both on a grid of screen sizes and requires the
     same file and the same box to 0.01 px. Open: /Projects/Saker/tests/poster-place.html — result in #out and window.RESULT. -->
<pre id="out">running…</pre>
<script>
(async () => {
  const out = document.getElementById('out');
  try {
    const html = await (await fetch('../index.html', { cache: 'no-store' })).text();
    // (built from pieces: the comment-opener followed by a script tag inside an inline script swallows the page)
    const block = new RegExp('<' + '!-- posters:begin[\\s\\S]*?<' + 'script>([\\s\\S]*?)<' + '/script>').exec(html);
    if (!block) throw new Error('posters block not found in index.html');
    new Function(block[1])();                                   // defines SAKER_POSTERS + SAKER_POSTER_BOOT
    await new Promise((ok, no) => { const s = document.createElement('script'); s.src = '../assets/terrain.js?t=' + Date.now(); s.onload = ok; s.onerror = no; document.head.appendChild(s); });
    const T = window.SakerTerrain, rows = [], bad = [];
    const Ws = [320, 360, 375, 390, 414, 430, 480, 540, 600, 700, 768, 820, 1024, 1180, 1280, 1366, 1440, 1536, 1600, 1920, 2048, 2560, 3840];
    const Hs = [480, 568, 667, 740, 812, 844, 896, 932, 1024, 1112, 1366, 600, 700, 768, 800, 900, 1080, 1111, 1200, 1440, 2160];
    for (const W of Ws) for (const H of Hs) {
      const b = window.SAKER_POSTER_BOOT(W, H), p = T.pickPoster(W, H);
      if (!b || !p) { if (!!b !== !!p) bad.push(`${W}×${H}: one side found no poster`); continue; }
      const t = T.posterBox(p, T.layout(W, H)), d = Math.max(Math.abs(b.left - t.left), Math.abs(b.top - t.top), Math.abs(b.w - t.w), Math.abs(b.h - t.h));
      const sameUrl = b.url === T.posterUrl(p);
      rows.push(d);
      if (b.p.f !== p.f || d > 0.01 || !sameUrl) bad.push(`${W}×${H}: head ${b.p.f} ${[b.left, b.top, b.w, b.h].map(v => v.toFixed(2))} vs terrain ${p.f} ${[t.left, t.top, t.w, t.h].map(v => v.toFixed(2))}${sameUrl ? '' : ' (url differs)'}`);
    }
    window.RESULT = { checked: rows.length, failures: bad.length, maxDiffPx: +Math.max(...rows).toFixed(6), first: bad.slice(0, 5) };
    out.innerHTML = `<span class="${bad.length ? 'bad' : 'ok'}">${rows.length} screen sizes · ${bad.length} differ · largest difference ${window.RESULT.maxDiffPx} px</span>\n` + bad.slice(0, 20).join('\n');
  } catch (e) { window.RESULT = { error: String(e) }; out.textContent = 'ERROR ' + e; }
})();
</script>
</body>
</html>
